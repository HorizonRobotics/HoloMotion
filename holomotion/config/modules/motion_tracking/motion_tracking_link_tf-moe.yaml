# @package _global_

modules:
  actor:
    type: ReferenceRoutedGroupedMoETransformerPolicy
    use_checkpointing: false
    num_fine_experts: 1024
    num_shared_experts: 1
    top_k: 2
    moe_loss_coef: 0.0
    routing_score_fn: ${algo.config.moe_router.routing_score_fn}
    routing_scale: ${algo.config.moe_router.routing_scale}
    use_dynamic_bias: ${algo.config.moe_router.use_dynamic_bias}
    bias_update_rate: ${algo.config.moe_router.bias_update_rate}
    expert_bias_clip: ${algo.config.moe_router.expert_bias_clip}
    routed_expert_usage_ema_decay: 0.99
    routed_expert_usage_ema_dead_threshold: 1.0e-06
    obs_embed_mlp_hidden: 2048
    router_embed_mlp_hidden: 2048
    router_obs_terms:
    - unified/actor_link_reference_height
    - unified/actor_link_link_mask
    - unified/actor_link_time_valid
    - unified/actor_link_target_pos
    - unified/actor_link_target_rot6d
    - unified/actor_link_time_offsets
    d_model: 512
    n_heads: 8
    n_kv_heads: 4
    use_gated_attn: true
    n_layers: 1
    dense_layer_at_first: false
    ff_mult: 0.5
    ff_mult_dense: 4
    attn_dropout: 0.0
    mlp_dropout: 0.0
    max_ctx_len: 32
    rope_max_seq_len: 8192
    aux_sys_id_weight: 0.0
    aux_dynamics_weight: 0.0
    obs_norm:
      enabled: true
      epsilon: 1.0e-08
      update_method: ema
      ema_momentum: 0.0001
      update_at_train: true
      update_at_eval: false
      enable_clipping: true
      clip_range: 10.0
      sync_interval_steps: 4
    obs_schema:
      flattened_obs:
        seq_len: ${obs.context_length}
        terms:
        - unified/actor_projected_gravity
        - unified/actor_rel_robot_root_ang_vel
        - unified/actor_dof_pos
        - unified/actor_dof_vel
        - unified/actor_last_action
        - unified/actor_link_reference_height
        - unified/actor_link_link_mask
        - unified/actor_link_time_valid
      flattened_obs_fut:
        seq_len: ${obs.n_fut_frames}
        terms: ${_link_module_future_terms.actor.${_link_error_schema_key}}
    output_dim: robot_action_dim
  critic:
    type: MLP
    obs_norm:
      enabled: true
      epsilon: 1.0e-08
      update_method: ema
      ema_momentum: 0.0001
      update_at_train: true
      update_at_eval: false
      enable_clipping: true
      clip_range: 10.0
      sync_interval_steps: 4
    hidden_norm: rmsnorm
    layer_config:
      hidden_dims:
      - 2048
      - 2048
      - 2048
      - 2048
      activation: SiLU
    obs_schema:
      flattened_obs:
        seq_len: 1
        terms:
        - unified/critic_rel_robot_root_lin_vel
        - unified/critic_rel_robot_root_ang_vel
        - unified/critic_global_robot_bodylink_lin_vel_flat
        - unified/critic_global_robot_bodylink_ang_vel_flat
        - unified/critic_root_rel_robot_bodylink_pos_flat
        - unified/critic_root_rel_robot_bodylink_rot_mat_flat
        - unified/critic_dof_pos
        - unified/critic_dof_vel
        - unified/critic_last_action
        - unified/critic_global_anchor_diff
        - unified/critic_projected_gravity
        - unified/critic_root_height
        - unified/critic_link_reference_height
        - unified/critic_link_link_mask
        - unified/critic_link_time_valid
      flattened_obs_fut:
        seq_len: ${obs.critic_n_fut_frames}
        terms: ${_link_module_future_terms.critic.${_link_error_schema_key}}
    output_dim: 1
_link_module_future_terms:
  actor:
    errors_True:
    - unified/actor_link_target_pos
    - unified/actor_link_position_error
    - unified/actor_link_target_rot6d
    - unified/actor_link_rotation_error6d
    - unified/actor_link_time_offsets
    errors_False:
    - unified/actor_link_target_pos
    - unified/actor_link_target_rot6d
    - unified/actor_link_time_offsets
  critic:
    errors_True:
    - unified/critic_link_target_pos
    - unified/critic_link_position_error
    - unified/critic_link_target_rot6d
    - unified/critic_link_rotation_error6d
    - unified/critic_link_time_offsets
    errors_False:
    - unified/critic_link_target_pos
    - unified/critic_link_target_rot6d
    - unified/critic_link_time_offsets
