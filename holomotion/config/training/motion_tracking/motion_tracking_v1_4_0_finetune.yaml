# @package _global_

defaults:
  - /training/motion_tracking/motion_tracking_v1_4_0
  - _self_

# The checkpoint file requires the sibling model_14000/actor and
# model_14000/critic directories from the published model package.
checkpoint: ${oc.env:HOLOMOTION_FINETUNE_CHECKPOINT,checkpoints/holomotion_v1.4/model_14000.pt}

algo:
  config:
    # Strictly warm-start actor/critic (including normalization buffers), but
    # reset Adam state and iteration-dependent schedules for the new task.
    checkpoint_load_mode: finetune
    num_learning_iterations: 10000

mujoco_eval:
  ckpt_onnx_names:
    - model_2000.onnx
    - model_4000.onnx
    - model_6000.onnx
    - model_8000.onnx
    - model_10000.onnx
