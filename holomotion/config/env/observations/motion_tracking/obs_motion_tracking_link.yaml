# @package _global_

obs:
  context_length: 1
  n_fut_frames: ${eval:'len(${link_observation.frame_offsets})'}
  critic_n_fut_frames: ${eval:'len(${link_observation.critic_frame_offsets})'}
  target_fps: 50
  actor_obs_prefix: ref_
  critic_obs_prefix: ref_
  obs_groups:
    unified:
      atomic_obs_list: ${_link_atomic_observation_variants.${_link_error_schema_key}}
      additional_atomic_obs_list: []
      enable_corruption: true
      concatenate_terms: false
env:
  config:
    commands:
      ref_motion:
        params:
          n_fut_frames: ${eval:'max(max(${link_observation.frame_offsets}), max(${link_observation.critic_frame_offsets}))'}
_link_error_schema_key: errors_${link_observation.include_error_terms}
_link_atomic_observation_variants:
  errors_True:
  - actor_projected_gravity:
      func: link_feedback
      params:
        name: projected_gravity
        actor: true
      history_length: ${obs.context_length}
      flatten_history_dim: false
  - actor_rel_robot_root_ang_vel:
      func: link_feedback
      params:
        name: root_ang_vel
        actor: true
      history_length: ${obs.context_length}
      flatten_history_dim: false
